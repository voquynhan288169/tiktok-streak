name: TikTok Streak
on:
  schedule:
    - cron: "0 1,13 * * *"   # 08:00 và 20:00 giờ Việt Nam
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: xvfb-run -a python run.py
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
